[package]
name = "vole-kit"
version = "0.7.0"
edition = "2024"
description = "The shared product kit of Vigilant Vole and its sibling products: auth, i18n, database, HTTP conventions, API docs, MCP and notifications."
license = "AGPL-3.0-only"
publish = false
# Products read DEP_VOLE_KIT_TEMPLATES (build.rs) to compile the kit's templates.
links = "vole-kit"

[features]
# What a product's own tests may need: the software passkey authenticator
# (`auth::webauthn::soft`), and `/setup` open without a token by default
# (`auth::session::set_setup_open_for_tests`). Enable it under
# `[dev-dependencies]` only.
test-support = []

[dependencies]
argon2 = { workspace = true }
askama = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
ciborium = { workspace = true }
deadpool-sqlite = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
jiff = { workspace = true }
lettre = { workspace = true }
qrcode = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
rust-embed = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
totp-rs = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
webpki-root-certs = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
tokio-rustls = { workspace = true }
tower = { workspace = true }
