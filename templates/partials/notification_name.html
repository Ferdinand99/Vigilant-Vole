{#- Channel name field. Needs: form (ChannelForm). -#}
<div class="field{% if !form.name_error.is_empty() %} is-invalid{% endif %}">
  <label class="label" for="f-name">{{ tr("common.name") }}</label>
  <input id="f-name" name="name" type="text" value="{{ form.name }}" placeholder="{{ tr1("notif.name_placeholder", "service", form.label) }}" required maxlength="100" autocomplete="off"
    {%- if !form.name_error.is_empty() %} aria-invalid="true" aria-describedby="f-name-error"{% endif %}>
  {%- if !form.name_error.is_empty() %}
  <p class="field-error" id="f-name-error"><svg class="icon" aria-hidden="true"><use href="/static/icons.svg#alert-circle"></use></svg>{{ form.name_error }}</p>
  {%- endif %}
</div>
