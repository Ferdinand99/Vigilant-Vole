{% extends "layout.html" %}

{% block title %}{{ heading }} - Vigilant Vole{% endblock %}

{% block content %}
<h2>{{ heading }}</h2>
<div class="card">
    <form method="post" action="{{ action }}">
        <label>Name
            <input type="text" name="name" value="{{ name }}" required>
        </label>
        <label>Type
            <select name="monitor_type">
                <option value="http" {% if monitor_type == "http" %}selected{% endif %}>HTTP(S)</option>
                <option value="tcp" {% if monitor_type == "tcp" %}selected{% endif %}>TCP Port</option>
                <option value="ping" {% if monitor_type == "ping" %}selected{% endif %}>Ping</option>
            </select>
        </label>
        <label>Target
            <input type="text" name="target" value="{{ target }}" required
                   placeholder="https://example.com, host:port, or a hostname/IP">
        </label>
        <label>Interval (seconds)
            <input type="number" name="interval_seconds" value="{{ interval_seconds }}" min="5">
        </label>
        <label>Timeout (seconds)
            <input type="number" name="timeout_seconds" value="{{ timeout_seconds }}" min="1">
        </label>
        <label>Retries before down
            <input type="number" name="retries" value="{{ retries }}" min="0">
        </label>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="/" class="btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
