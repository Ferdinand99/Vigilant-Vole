{% extends "auth_layout.html" %}
{% import "macros.html" as m %}

{% block subtitle %}<p class="auth-sub">{{ tr("login.subtitle") }}</p>{% endblock %}

{% block content %}
{%- if let Some(msg) = notice %}
{{ m::callout("info", msg) }}
{%- endif %}
<form class="form" method="post" action="/login">
  <input type="hidden" name="next" value="{{ next }}">
  <div class="field">
    <label class="label" for="f-username">{{ tr("login.username") }}</label>
    <input id="f-username" name="username" type="text" value="{{ username }}" required{% if username.is_empty() %} autofocus{% endif %} autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="64">
  </div>
  <div class="field">
    <label class="label" for="f-password">{{ tr("login.password") }}</label>
    <input id="f-password" name="password" type="password" required{% if !username.is_empty() %} autofocus{% endif %} autocomplete="current-password" maxlength="1024">
  </div>
  <button type="submit" class="btn btn-primary btn-lg btn-block">{{ tr("login.submit") }}</button>
</form>
{% endblock %}
