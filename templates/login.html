{% extends "layout.html" %}

{% block title %}Login - Vigilant Vole{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="card">
        <h2>Log in</h2>
        {% if let Some(err) = error %}
        <p class="error">{{ err }}</p>
        {% endif %}
        <form method="post" action="/login">
            <label>Username
                <input type="text" name="username" required autofocus>
            </label>
            <label>Password
                <input type="password" name="password" required>
            </label>
            <button type="submit" class="btn btn-primary">Log in</button>
        </form>
    </div>
</div>
{% endblock %}
