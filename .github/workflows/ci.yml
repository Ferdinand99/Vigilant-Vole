# Lints and unit tests for every pull request and every push to main.
# The toolchain matches the Dockerfile's RUST_VERSION.
# (No `cargo fmt --check`: the tree isn't rustfmt-formatted.)
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Clippy and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace --lib

      # Snapshots of externally visible behaviour (docs/golden-tests.md).
      - name: Golden snapshots
        run: cargo test --test golden

      # vole-kit stays free of Vigilant Vole, and a second product
      # (examples/kit-demo) runs on it alone.
      - name: Kit boundary and kit demo
        run: |
          cargo test --test kit_boundary
          cargo test -p kit-demo

  upgrade:
    # Databases saved by every release (tests/fixtures/upgrade, made by
    # tools/upgrade-fixtures/generate.sh) upgraded with this build, plus the
    # backup/restore and config round-trip drills. No network needed.
    name: Upgrade and backup drills
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.99

      - uses: Swatinem/rust-cache@v2

      - name: Upgrade from every release
        run: cargo test --test upgrade

      - name: Backup and restore drills
        run: cargo test --test backup_restore

  # THIRD-PARTY-NOTICES lists the licence texts of the Rust crates and front-end files in the
  # binary. It is made from the dependencies (scripts/notices.sh), so a changed dependency makes it
  # stale: this job fails then. It also fails when a dependency has a licence that is not on the
  # allowlist in about.toml, or no licence text at all. The release archive is packed here with a
  # stand-in binary to show that it carries the file; the Docker image is checked in the Docker
  # image workflow.
  notices:
    name: Third-party notices (up to date, licences allowed)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.99

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Pinned version and pinned checksum. Keep the version equal to want_version in
      # scripts/notices.sh.
      - name: Install cargo-about
        env:
          CARGO_ABOUT_VERSION: "0.9.3"
          CARGO_ABOUT_SHA256: "3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4"
        run: |
          name="cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/cargo-about.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/${name}.tar.gz"
          echo "${CARGO_ABOUT_SHA256}  $RUNNER_TEMP/cargo-about.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/cargo-about.tar.gz" -C "$HOME/.local/bin" --strip-components=1 "${name}/cargo-about"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Tests of the notices scripts
        run: node --test "scripts/*.test.mjs"

      # --fail is what makes an unreadable licence stop the check; this test proves it.
      - name: cargo-about stops on a crate with an unreadable licence
        run: scripts/test-notices-fail.sh

      - name: THIRD-PARTY-NOTICES is up to date
        run: scripts/notices.sh --check

      - name: The release archive carries the licence texts
        run: |
          printf '#!/bin/sh\necho stand-in\n' > "$RUNNER_TEMP/vigilant-vole"
          deploy/package-release.sh "$RUNNER_TEMP/vigilant-vole" x86_64-unknown-linux-musl v0.0.0 "$RUNNER_TEMP/dist"
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP/dist/vigilant-vole-x86_64-unknown-linux-musl.tar.gz" -C "$RUNNER_TEMP/unpacked"
          cmp THIRD-PARTY-NOTICES "$RUNNER_TEMP/unpacked/vigilant-vole-x86_64-unknown-linux-musl/THIRD-PARTY-NOTICES"
          cmp LICENSE "$RUNNER_TEMP/unpacked/vigilant-vole-x86_64-unknown-linux-musl/LICENSE"
          echo "ok: the archive holds THIRD-PARTY-NOTICES and LICENSE"
