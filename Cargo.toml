[package]
name = "vigilant-vole"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
askama = "0.16.1"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie", "cookie-signed"] }
deadpool-sqlite = "0.14.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
surge-ping = "0.9.1"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.53.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
