[target]
target_url.label = "URL"
target_url.help = "Die vollständige Adresse einschließlich https://."
target_ws.label = "URL"
target_ws.help = "Eine ws://- oder wss://-Adresse. http(s):// funktioniert ebenfalls."
target_hostport.label = "Host und Port"
target_hostport.help = "Setze IPv6-Adressen in eckige Klammern, z. B. [2001:db8::1]:443."
target_host.label = "Host"
target_host.help = "Ein Hostname oder eine IP-Adresse."
target_tailscale.label = "Tailscale-Peer"
target_tailscale.help = "Der Maschinenname des Peers (wie in der Tailscale-Admin-Konsole), sein MagicDNS-Name oder eine Tailscale-IP wie 100.64.0.5."
target_dns.label = "Abzufragender Name"
target_dns.help = "Gib bei PTR-Einträgen die IP-Adresse ein."
target_docker.label = "Container"
target_docker.help = "Name oder ID des Containers."
target_domain.label = "Domain"
target_domain.help = "Subdomains und URLs werden auf die registrierte Domain gekürzt."
target_ntp.label = "Server"
target_ntp.help = "Verwendet Port 123, sofern du keinen angibst."
target_steam.label = "Server"
target_steam.help = "Verwendet Port 27015, sofern du keinen angibst."
target_game.label = "Spieleserver"
target_game.help = "Beginne mit dem Spiel: minecraft:// (Port 25565; ohne Port wird zuerst der SRV-Eintrag _minecraft._tcp versucht), bedrock:// (19132), satisfactory:// (7777), fivem:// (30120, auch RedM) oder mumble:// (64738)."
target_tls.label = "Server"
target_tls.help = "Verwendet Port 443, sofern du keinen angibst. Funktioniert für jeden Dienst, der ab dem ersten Byte TLS spricht (HTTPS, IMAPS, LDAPS, …)."
target_smtp.label = "Mailserver"
target_smtp.help = "Verwendet Port 25, sofern du keinen angibst. Port 465 gilt als implizites TLS; auf anderen Ports wird per STARTTLS aufgerüstet, wenn der Server es anbietet."
target_redis.label = "Redis-Server"
target_redis.help = "Verwendet Port 6379. Füge rediss:// für TLS und /2 zur Wahl einer Datenbank hinzu."
target_postgres.label = "PostgreSQL-Server"
target_postgres.help = "Verwendet Port 5432. Der Pfad ist der Datenbankname. TLS wird genutzt, wenn der Server es anbietet; füge ?sslmode=verify-full hinzu, um auch das Zertifikat zu prüfen (oder disable, require, verify-ca)."
target_mysql.label = "MySQL- oder MariaDB-Server"
target_mysql.help = "Verwendet Port 3306. Ohne Benutzername wird nur die Begrüßung des Servers geprüft. TLS wird genutzt, wenn der Server es anbietet; füge ?sslmode=verify-full hinzu, um auch das Zertifikat zu prüfen."
target_mqtt.label = "MQTT-Broker"
target_mqtt.help = "Verwendet Port 1883 (8883 bei mqtts://). Füge ein Topic als Pfad hinzu, um es zu abonnieren; Platzhalter (+ und #) funktionieren wie geschrieben."
target_kafka.label = "Kafka-Broker"
target_kafka.help = "Verwendet Port 9092 (9093 bei kafkas://). Füge ein Topic als Pfad hinzu, um zu prüfen, ob es existiert."
target_rabbitmq.label = "RabbitMQ-Broker"
target_rabbitmq.help = "Verwendet Port 5672 (5671 bei amqps://). Der Pfad ist der Virtual Host; Standard ist /."
target_grpc.label = "gRPC-Server"
target_grpc.help = "Verwendet Port 50051 (443 bei grpcs://). Der Pfad ist der Dienstname für den standardmäßigen Health-Check; leer lassen für den ganzen Server."
target_grpc_keyword.label = "gRPC-Methode"
target_grpc_keyword.help = "Nutzt Port 50051 (443 bei grpcs://, was auch das Zertifikat prüft). Der Pfad ist der Dienst und die unäre Methode, die aufgerufen wird; ein kurzer Dienstname genügt, wenn er eindeutig ist."
target_radius.label = "RADIUS-Server"
target_radius.help = "Verwendet Port 1812."
target_snmp.label = "SNMP-Gerät"
target_snmp.help = "Verwendet Port 161. Der Pfad ist die zu lesende OID; Standard ist sysUpTime (1.3.6.1.2.1.1.3.0)."
target_sqlserver.label = "SQL Server"
target_sqlserver.help = "Nutzt Port 1433. Der Pfad ist die Datenbank. Ohne Benutzername wird nur der Pre-Login geprüft. Verschlüsselt, wenn der Server es kann; hänge ?encrypt=true&trustServerCertificate=false an, um auch das Zertifikat zu prüfen (oder encrypt=false, disable, strict)."
target_mongodb.label = "MongoDB-Server"
target_mongodb.help = "Nutzt Port 27017. Mehrere Hosts mit Kommas auflisten oder mongodb+srv:// verwenden. Hänge ?tls=true für TLS an (das Zertifikat wird geprüft; tlsAllowInvalidCertificates=true überspringt das) und ?replicaSet=, um einen Primary zu verlangen. Der Pfad oder authSource ist die Authentifizierungsdatenbank (Standard admin)."
target_browser.label = "Seiten-URL"
target_browser.help = "Die Seite, die der Remote-Browser öffnet, einschließlich https://."
target_browser.placeholder = "https://shop.example.com/…"

