target_ntp.help = "Usa a porta 123, a menos que você adicione outra."
target_steam.label = "Servidor"
target_steam.help = "Usa a porta 27015, a menos que você adicione outra."
target_game.label = "Servidor de jogo"
target_game.help = "Comece pelo jogo: minecraft:// (porta 25565; sem porta, o registro SRV _minecraft._tcp é tentado primeiro), bedrock:// (19132), satisfactory:// (7777), fivem:// (30120, também RedM) ou mumble:// (64738)."
target_tls.label = "Servidor"
target_tls.help = "Usa a porta 443, a menos que você adicione outra. Funciona com qualquer serviço que fale TLS desde o primeiro byte (HTTPS, IMAPS, LDAPS, …)."
target_smtp.label = "Servidor de e-mail"
target_smtp.help = "Usa a porta 25, a menos que você adicione outra. A porta 465 é tratada como TLS implícito; as demais são atualizadas com STARTTLS quando o servidor oferece."
target_redis.label = "Servidor Redis"
target_redis.help = "Usa a porta 6379. Adicione rediss:// para TLS e /2 para escolher um banco."
target_postgres.label = "Servidor PostgreSQL"
target_postgres.help = "Usa a porta 5432. O caminho é o nome do banco. O TLS é usado quando o servidor oferece; adicione ?sslmode=verify-full para verificar também o certificado (ou disable, require, verify-ca)."
target_mysql.label = "Servidor MySQL ou MariaDB"
target_mysql.help = "Usa a porta 3306. Sem nome de usuário, só a saudação do servidor é verificada. O TLS é usado quando o servidor oferece; adicione ?sslmode=verify-full para verificar também o certificado."
target_mqtt.label = "Broker MQTT"
target_mqtt.help = "Usa a porta 1883 (8883 para mqtts://). Adicione um tópico como caminho para assiná-lo; curingas (+ e #) funcionam como escritos."
target_kafka.label = "Broker Kafka"
target_kafka.help = "Usa a porta 9092 (9093 para kafkas://). Adicione um tópico como caminho para verificar se ele existe."
target_rabbitmq.label = "Broker RabbitMQ"
target_rabbitmq.help = "Usa a porta 5672 (5671 para amqps://). O caminho é o virtual host; o padrão é /."
target_grpc.label = "Servidor gRPC"
target_grpc.help = "Usa a porta 50051 (443 para grpcs://). O caminho é o nome do serviço para a verificação de integridade padrão; deixe vazio para o servidor inteiro."
target_grpc_keyword.label = "Método gRPC"
target_grpc_keyword.help = "Usa a porta 50051 (443 para grpcs://, que também verifica o certificado). O caminho é o serviço e o método unário a chamar; um nome de serviço curto funciona quando é único."
target_radius.label = "Servidor RADIUS"
target_radius.help = "Usa a porta 1812."
target_snmp.label = "Dispositivo SNMP"
target_snmp.help = "Usa a porta 161. O caminho é o OID a ler; o padrão é sysUpTime (1.3.6.1.2.1.1.3.0)."
target_sqlserver.label = "SQL Server"
target_sqlserver.help = "Usa a porta 1433. O caminho é o banco de dados. Sem nome de usuário, só o pre-login é verificado. Criptografado quando o servidor puder; adicione ?encrypt=true&trustServerCertificate=false para verificar também o certificado (ou encrypt=false, disable, strict)."
target_mongodb.label = "Servidor MongoDB"
target_mongodb.help = "Usa a porta 27017. Liste vários hosts separados por vírgulas ou use mongodb+srv://. Adicione ?tls=true para TLS (o certificado é verificado; tlsAllowInvalidCertificates=true ignora isso) e ?replicaSet= para exigir um primário. O caminho ou authSource é o banco de autenticação (padrão admin)."
target_browser.label = "URL da página"
target_browser.help = "A página que o navegador remoto abre, incluindo https://."
target_browser.placeholder = "https://shop.example.com/…"

