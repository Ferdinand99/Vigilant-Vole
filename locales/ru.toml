target_dns.label = "Искомое имя"
target_dns.help = "Для записей PTR введите IP-адрес."
target_docker.label = "Контейнер"
target_docker.help = "Имя или ID контейнера."
target_domain.label = "Домен"
target_domain.help = "Поддомены и URL приводятся к зарегистрированному домену."
target_ntp.label = "Сервер"
target_ntp.help = "Порт 123, если не указан другой."
target_steam.label = "Сервер"
target_steam.help = "Порт 27015, если не указан другой."
target_game.label = "Игровой сервер"
target_game.help = "Начните с игры: minecraft:// (порт 25565; без порта сначала пробуется SRV-запись _minecraft._tcp), bedrock:// (19132), satisfactory:// (7777), fivem:// (30120, также RedM) или mumble:// (64738)."
target_tls.label = "Сервер"
target_tls.help = "Порт 443, если не указан другой. Подходит для любого сервиса, который говорит по TLS с первого байта (HTTPS, IMAPS, LDAPS, …)."
target_smtp.label = "Почтовый сервер"
target_smtp.help = "Порт 25, если не указан другой. Порт 465 считается неявным TLS; на остальных портах соединение повышается через STARTTLS, если сервер это предлагает."
target_redis.label = "Сервер Redis"
target_redis.help = "Порт 6379. Добавьте rediss:// для TLS и /2 для выбора базы данных."
target_postgres.label = "Сервер PostgreSQL"
target_postgres.help = "Порт 5432. Путь — имя базы данных. TLS используется, если сервер его предлагает; добавьте ?sslmode=verify-full, чтобы проверять и сертификат (или disable, require, verify-ca)."
target_mysql.label = "Сервер MySQL или MariaDB"
target_mysql.help = "Порт 3306. Без имени пользователя проверяется только приветствие сервера. TLS используется, если сервер его предлагает; добавьте ?sslmode=verify-full, чтобы проверять и сертификат."
target_mqtt.label = "Брокер MQTT"
target_mqtt.help = "Порт 1883 (8883 для mqtts://). Добавьте тему как путь, чтобы подписаться на нее; подстановочные знаки (+ и #) работают как написаны."
target_kafka.label = "Брокер Kafka"
target_kafka.help = "Порт 9092 (9093 для kafkas://). Добавьте тему как путь, чтобы проверить ее существование."
target_rabbitmq.label = "Брокер RabbitMQ"
target_rabbitmq.help = "Порт 5672 (5671 для amqps://). Путь — виртуальный хост; по умолчанию /."
target_grpc.label = "Сервер gRPC"
target_grpc.help = "Порт 50051 (443 для grpcs://). Путь — имя сервиса для стандартной проверки работоспособности; пусто — весь сервер."
target_grpc_keyword.label = "Метод gRPC"
target_grpc_keyword.help = "Порт 50051 (443 для grpcs://, где также проверяется сертификат). Путь — это сервис и унарный метод для вызова; краткое имя сервиса подойдет, если оно уникально."
target_radius.label = "Сервер RADIUS"
target_radius.help = "Порт 1812."
target_snmp.label = "Устройство SNMP"
target_snmp.help = "Порт 161. Путь — OID для чтения; по умолчанию sysUpTime (1.3.6.1.2.1.1.3.0)."
target_sqlserver.label = "SQL Server"
target_sqlserver.help = "Порт 1433. Путь — это база данных. Без имени пользователя проверяется только pre-login. Шифрование включается, когда сервер его поддерживает; добавьте ?encrypt=true&trustServerCertificate=false, чтобы проверять и сертификат (или encrypt=false, disable, strict)."
target_mongodb.label = "Сервер MongoDB"
target_mongodb.help = "Порт 27017. Перечислите несколько хостов через запятую или используйте mongodb+srv://. Добавьте ?tls=true для TLS (сертификат проверяется; tlsAllowInvalidCertificates=true отключает проверку) и ?replicaSet=, чтобы требовать primary. Путь или authSource — база данных аутентификации (по умолчанию admin)."
target_browser.label = "URL страницы"
target_browser.help = "Страница, которую открывает удаленный браузер, включая https://."
target_browser.placeholder = "https://shop.example.com/…"

