target_docker.help = "Containerens navn eller ID."
target_domain.label = "Domæne"
target_domain.help = "Subdomæner og URL’er reduceres til det registrerede domæne."
target_ntp.label = "Server"
target_ntp.help = "Bruger port 123, medmindre du tilføjer en."
target_steam.label = "Server"
target_steam.help = "Bruger port 27015, medmindre du tilføjer en."
target_game.label = "Spilserver"
target_game.help = "Start med spillet: minecraft:// (port 25565; uden port prøves SRV-posten _minecraft._tcp først), bedrock:// (19132), satisfactory:// (7777), fivem:// (30120, også RedM) eller mumble:// (64738)."
target_tls.label = "Server"
target_tls.help = "Bruger port 443, medmindre du tilføjer en. Virker for enhver tjeneste, der taler TLS fra første byte (HTTPS, IMAPS, LDAPS, …)."
target_smtp.label = "Mailserver"
target_smtp.help = "Bruger port 25, medmindre du tilføjer en. Port 465 behandles som implicit TLS. Andre porte opgraderes med STARTTLS, når serveren tilbyder det."
target_redis.label = "Redis-server"
target_redis.help = "Bruger port 6379. Tilføj rediss:// for TLS og /2 for at vælge en database."
target_postgres.label = "PostgreSQL-server"
target_postgres.help = "Bruger port 5432. Stien er databasenavnet. TLS bruges, når serveren tilbyder det. Tilføj ?sslmode=verify-full for også at tjekke certifikatet (eller disable, require, verify-ca)."
target_mysql.label = "MySQL- eller MariaDB-server"
target_mysql.help = "Bruger port 3306. Uden brugernavn tjekkes kun serverens velkomsthilsen. TLS bruges, når serveren tilbyder det. Tilføj ?sslmode=verify-full for også at tjekke certifikatet."
target_mqtt.label = "MQTT-broker"
target_mqtt.help = "Bruger port 1883 (8883 for mqtts://). Tilføj et emne som sti for at abonnere på det. Jokertegn (+ og #) virker, som de står."
target_kafka.label = "Kafka-broker"
target_kafka.help = "Bruger port 9092 (9093 for kafkas://). Tilføj et emne som sti for at tjekke, at det findes."
target_rabbitmq.label = "RabbitMQ-broker"
target_rabbitmq.help = "Bruger port 5672 (5671 for amqps://). Stien er den virtuelle vært. Standard er /."
target_grpc.label = "gRPC-server"
target_grpc.help = "Bruger port 50051 (443 for grpcs://). Stien er tjenestenavnet til det standardiserede sundhedstjek. Lad den stå tom for hele serveren."
target_grpc_keyword.label = "gRPC-metode"
target_grpc_keyword.help = "Bruger port 50051 (443 for grpcs://, som også kontrollerer certifikatet). Stien er tjenesten og den unary-metode, der kaldes; et kort tjenestenavn virker, når det er entydigt."
target_radius.label = "RADIUS-server"
target_radius.help = "Bruger port 1812."
target_snmp.label = "SNMP-enhed"
target_snmp.help = "Bruger port 161. Stien er den OID, der skal læses. Standard er sysUpTime (1.3.6.1.2.1.1.3.0)."
target_sqlserver.label = "SQL Server"
target_sqlserver.help = "Bruger port 1433. Stien er databasen. Uden brugernavn kontrolleres kun pre-login. Krypteret, når serveren kan; tilføj ?encrypt=true&trustServerCertificate=false for også at kontrollere certifikatet (eller encrypt=false, disable, strict)."
target_mongodb.label = "MongoDB-server"
target_mongodb.help = "Bruger port 27017. Angiv flere værter med kommaer, eller brug mongodb+srv://. Tilføj ?tls=true for TLS (certifikatet kontrolleres; tlsAllowInvalidCertificates=true springer det over) og ?replicaSet= for at kræve en primær. Stien eller authSource er godkendelsesdatabasen (standard admin)."
target_browser.label = "Side-URL"
target_browser.help = "Siden, som fjernbrowseren åbner, inklusive https://."
target_browser.placeholder = "https://shop.example.com/…"

