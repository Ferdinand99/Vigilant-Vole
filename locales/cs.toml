target_docker.label = "Kontejner"
target_docker.help = "Název nebo ID kontejneru."
target_domain.label = "Doména"
target_domain.help = "Subdomény a URL se zkrátí na registrovanou doménu."
target_ntp.label = "Server"
target_ntp.help = "Používá port 123, pokud nepřidáte jiný."
target_steam.label = "Server"
target_steam.help = "Používá port 27015, pokud nepřidáte jiný."
target_game.label = "Herní server"
target_game.help = "Začněte hrou: minecraft:// (port 25565; bez portu se nejdřív zkusí záznam SRV _minecraft._tcp), bedrock:// (19132), satisfactory:// (7777), fivem:// (30120, také RedM) nebo mumble:// (64738)."
target_tls.label = "Server"
target_tls.help = "Používá port 443, pokud nepřidáte jiný. Funguje pro každou službu, která mluví TLS od prvního bajtu (HTTPS, IMAPS, LDAPS, …)."
target_smtp.label = "Poštovní server"
target_smtp.help = "Používá port 25, pokud nepřidáte jiný. Port 465 se bere jako implicitní TLS; ostatní porty se povýší přes STARTTLS, pokud ho server nabízí."
target_redis.label = "Server Redis"
target_redis.help = "Používá port 6379. Pro TLS přidejte rediss:// a pro výběr databáze /2."
target_postgres.label = "Server PostgreSQL"
target_postgres.help = "Používá port 5432. Cesta je název databáze. TLS se použije, pokud ho server nabízí; přidáním ?sslmode=verify-full se ověří i certifikát (nebo disable, require, verify-ca)."
target_mysql.label = "Server MySQL nebo MariaDB"
target_mysql.help = "Používá port 3306. Bez uživatelského jména se kontroluje jen uvítání serveru. TLS se použije, pokud ho server nabízí; přidáním ?sslmode=verify-full se ověří i certifikát."
target_mqtt.label = "Broker MQTT"
target_mqtt.help = "Používá port 1883 (8883 pro mqtts://). Přidejte téma jako cestu a monitor ho odebírá; zástupné znaky (+ a #) fungují tak, jak jsou napsány."
target_kafka.label = "Broker Kafka"
target_kafka.help = "Používá port 9092 (9093 pro kafkas://). Přidejte téma jako cestu a ověří se, že existuje."
target_rabbitmq.label = "Broker RabbitMQ"
target_rabbitmq.help = "Používá port 5672 (5671 pro amqps://). Cesta je virtuální hostitel; výchozí je /."
target_grpc.label = "Server gRPC"
target_grpc.help = "Používá port 50051 (443 pro grpcs://). Cesta je název služby pro standardní kontrolu stavu; nechte prázdné pro celý server."
target_grpc_keyword.label = "Metoda gRPC"
target_grpc_keyword.help = "Používá port 50051 (443 pro grpcs://, který navíc kontroluje certifikát). Cesta je služba a unární metoda, která se zavolá; krátký název služby stačí, pokud je jedinečný."
target_radius.label = "Server RADIUS"
target_radius.help = "Používá port 1812."
target_snmp.label = "Zařízení SNMP"
target_snmp.help = "Používá port 161. Cesta je OID ke čtení; výchozí je sysUpTime (1.3.6.1.2.1.1.3.0)."
target_sqlserver.label = "SQL Server"
target_sqlserver.help = "Používá port 1433. Cesta je databáze. Bez uživatelského jména se kontroluje jen pre-login. Šifruje se, když to server umí; přidejte ?encrypt=true&trustServerCertificate=false, aby se kontroloval i certifikát (nebo encrypt=false, disable, strict)."
target_mongodb.label = "Server MongoDB"
target_mongodb.help = "Používá port 27017. Více hostitelů oddělte čárkami nebo použijte mongodb+srv://. Přidejte ?tls=true pro TLS (certifikát se kontroluje; tlsAllowInvalidCertificates=true to přeskočí) a ?replicaSet=, aby se vyžadoval primární uzel. Cesta nebo authSource je autentizační databáze (výchozí admin)."
target_browser.label = "Adresa stránky"
target_browser.help = "Stránka, kterou vzdálený prohlížeč otevře, včetně https://."
target_browser.placeholder = "https://shop.example.com/…"

