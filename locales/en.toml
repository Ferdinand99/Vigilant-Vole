target_game.help = "Start with the game: minecraft:// (port 25565; without a port the _minecraft._tcp SRV record is tried first), bedrock:// (19132), satisfactory:// (7777), fivem:// (30120, also RedM) or mumble:// (64738)."
target_tls.label = "Server"
target_tls.help = "Uses port 443 unless you add one. Works for any service that speaks TLS from the first byte (HTTPS, IMAPS, LDAPS, …)."
target_smtp.label = "Mail server"
target_smtp.help = "Uses port 25 unless you add one. Port 465 is treated as implicit TLS; other ports are upgraded with STARTTLS when the server offers it."
target_redis.label = "Redis server"
target_redis.help = "Uses port 6379. Add rediss:// for TLS and /2 to pick a database."
target_postgres.label = "PostgreSQL server"
target_postgres.help = "Uses port 5432. The path is the database name. TLS is used when the server offers it; add ?sslmode=verify-full to also check the certificate (or disable, require, verify-ca)."
target_mysql.label = "MySQL or MariaDB server"
target_mysql.help = "Uses port 3306. Without a user name only the server greeting is checked. TLS is used when the server offers it; add ?sslmode=verify-full to also check the certificate."
target_mqtt.label = "MQTT broker"
target_mqtt.help = "Uses port 1883 (8883 for mqtts://). Add a topic as the path to subscribe to it; wildcards (+ and #) work as written."
target_kafka.label = "Kafka broker"
target_kafka.help = "Uses port 9092 (9093 for kafkas://). Add a topic as the path to check that it exists."
target_rabbitmq.label = "RabbitMQ broker"
target_rabbitmq.help = "Uses port 5672 (5671 for amqps://). The path is the virtual host; the default is /."
target_grpc.label = "gRPC server"
target_grpc.help = "Uses port 50051 (443 for grpcs://). The path is the service name for the standard health check; leave it empty for the whole server."
target_grpc_keyword.label = "gRPC method"
target_grpc_keyword.help = "Uses port 50051 (443 for grpcs://, which also checks the certificate). The path is the service and the unary method to call; a short service name works when it is unique."
target_radius.label = "RADIUS server"
target_radius.help = "Uses port 1812."
target_snmp.label = "SNMP device"
target_snmp.help = "Uses port 161. The path is the OID to read; the default is sysUpTime (1.3.6.1.2.1.1.3.0)."
target_sqlserver.label = "SQL Server"
target_sqlserver.help = "Uses port 1433. The path is the database. Without a user name only the pre-login is checked. Encrypted when the server can; add ?encrypt=true&trustServerCertificate=false to also check the certificate (or encrypt=false, disable, strict)."
target_mongodb.label = "MongoDB server"
target_mongodb.help = "Uses port 27017. List several hosts with commas, or use mongodb+srv://. Add ?tls=true for TLS (the certificate is checked; tlsAllowInvalidCertificates=true skips that) and ?replicaSet= to require a primary. The path or authSource is the authentication database (default admin)."
target_browser.label = "Page URL"
target_browser.help = "The page the remote browser opens, including https://."
target_browser.placeholder = "https://shop.example.com/…"

