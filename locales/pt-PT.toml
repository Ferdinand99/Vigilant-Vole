[target]
target_url.label = "URL"
target_url.help = "O endereço completo, incluindo https://."
target_ws.label = "URL"
target_ws.help = "Um endereço ws:// ou wss://. http(s):// também funciona."
target_hostport.label = "Anfitrião e porta"
target_hostport.help = "Coloque os endereços IPv6 entre parênteses retos, como [2001:db8::1]:443."
target_host.label = "Anfitrião"
target_host.help = "Um nome de anfitrião ou endereço IP."
target_tailscale.label = "Par Tailscale"
target_tailscale.help = "O nome da máquina do par (como na consola de administração do Tailscale), o seu nome MagicDNS ou um IP Tailscale como 100.64.0.5."
target_dns.label = "Nome a procurar"
target_dns.help = "Para registos PTR, introduza o endereço IP."
target_docker.label = "Contentor"
target_docker.help = "O nome ou o ID do contentor."
target_domain.label = "Domínio"
target_domain.help = "Os subdomínios e URLs são reduzidos ao domínio registado."
target_ntp.label = "Servidor"
target_ntp.help = "Usa a porta 123, a menos que adicione outra."
target_steam.label = "Servidor"
target_steam.help = "Usa a porta 27015, a menos que adicione outra."
target_game.label = "Servidor de jogos"
target_game.help = "Comece pelo jogo: minecraft:// (porta 25565; sem porta, tenta-se primeiro o registo SRV _minecraft._tcp), bedrock:// (19132), satisfactory:// (7777), fivem:// (30120, também RedM) ou mumble:// (64738)."
target_tls.label = "Servidor"
target_tls.help = "Usa a porta 443, a menos que adicione outra. Funciona com qualquer serviço que fale TLS desde o primeiro byte (HTTPS, IMAPS, LDAPS, …)."
target_smtp.label = "Servidor de correio"
target_smtp.help = "Usa a porta 25, a menos que adicione outra. A porta 465 é tratada como TLS implícito; nas outras portas a ligação é atualizada com STARTTLS quando o servidor o oferece."
target_redis.label = "Servidor Redis"
target_redis.help = "Usa a porta 6379. Adicione rediss:// para TLS e /2 para escolher uma base de dados."
target_postgres.label = "Servidor PostgreSQL"
target_postgres.help = "Usa a porta 5432. O caminho é o nome da base de dados. O TLS é usado quando o servidor o oferece; adicione ?sslmode=verify-full para verificar também o certificado (ou disable, require, verify-ca)."
target_mysql.label = "Servidor MySQL ou MariaDB"
target_mysql.help = "Usa a porta 3306. Sem nome de utilizador, só é verificada a saudação do servidor. O TLS é usado quando o servidor o oferece; adicione ?sslmode=verify-full para verificar também o certificado."
target_mqtt.label = "Broker MQTT"
target_mqtt.help = "Usa a porta 1883 (8883 para mqtts://). Adicione um tópico como caminho para o subscrever; os carateres universais (+ e #) funcionam tal como escritos."
target_kafka.label = "Broker Kafka"
target_kafka.help = "Usa a porta 9092 (9093 para kafkas://). Adicione um tópico como caminho para verificar que existe."
target_rabbitmq.label = "Broker RabbitMQ"
target_rabbitmq.help = "Usa a porta 5672 (5671 para amqps://). O caminho é o virtual host; por predefinição é /."
target_grpc.label = "Servidor gRPC"
target_grpc.help = "Usa a porta 50051 (443 para grpcs://). O caminho é o nome do serviço para a verificação de estado padrão; deixe vazio para o servidor inteiro."
target_grpc_keyword.label = "Método gRPC"
target_grpc_keyword.help = "Usa a porta 50051 (443 para grpcs://, que também verifica o certificado). O caminho é o serviço e o método unário a chamar; um nome de serviço curto funciona se for único."
target_radius.label = "Servidor RADIUS"
target_radius.help = "Usa a porta 1812."
target_snmp.label = "Dispositivo SNMP"
target_snmp.help = "Usa a porta 161. O caminho é o OID a ler; por predefinição é sysUpTime (1.3.6.1.2.1.1.3.0)."
target_sqlserver.label = "SQL Server"
target_sqlserver.help = "Usa a porta 1433. O caminho é a base de dados. Sem nome de utilizador, só se verifica o pre-login. Cifrado quando o servidor o permite; acrescente ?encrypt=true&trustServerCertificate=false para verificar também o certificado (ou encrypt=false, disable, strict)."
target_mongodb.label = "Servidor MongoDB"
target_mongodb.help = "Usa a porta 27017. Indique vários anfitriões separados por vírgulas ou use mongodb+srv://. Acrescente ?tls=true para TLS (o certificado é verificado; tlsAllowInvalidCertificates=true ignora isso) e ?replicaSet= para exigir um primário. O caminho ou authSource é a base de dados de autenticação (predefinição admin)."
target_browser.label = "URL da página"
target_browser.help = "A página que o navegador remoto abre, incluindo https://."
target_browser.placeholder = "https://shop.example.com/…"

