target_postgres.help = "Käyttää porttia 5432. Polku on tietokannan nimi. TLS:ää käytetään, kun palvelin tarjoaa sitä; lisää ?sslmode=verify-full tarkistaaksesi myös varmenteen (tai disable, require, verify-ca)."
target_mysql.label = "MySQL- tai MariaDB-palvelin"
target_mysql.help = "Käyttää porttia 3306. Ilman käyttäjänimeä tarkistetaan vain palvelimen tervehdys. TLS:ää käytetään, kun palvelin tarjoaa sitä; lisää ?sslmode=verify-full tarkistaaksesi myös varmenteen."
target_mqtt.label = "MQTT-broker"
target_mqtt.help = "Käyttää porttia 1883 (8883 osoitteelle mqtts://). Lisää aihe polkuna tilataksesi sen; jokerimerkit (+ ja #) toimivat sellaisinaan."
target_kafka.label = "Kafka-broker"
target_kafka.help = "Käyttää porttia 9092 (9093 osoitteelle kafkas://). Lisää aihe polkuna tarkistaaksesi, että se on olemassa."
target_rabbitmq.label = "RabbitMQ-broker"
target_rabbitmq.help = "Käyttää porttia 5672 (5671 osoitteelle amqps://). Polku on virtuaalinen isäntä; oletus on /."
target_grpc.label = "gRPC-palvelin"
target_grpc.help = "Käyttää porttia 50051 (443 osoitteelle grpcs://). Polku on palvelun nimi vakiomuotoista terveystarkistusta varten; jätä tyhjäksi koko palvelinta varten."
target_grpc_keyword.label = "gRPC-metodi"
target_grpc_keyword.help = "Käyttää porttia 50051 (443 osoitteelle grpcs://, joka tarkistaa myös varmenteen). Polku on palvelu ja kutsuttava unary-metodi; lyhyt palvelun nimi riittää, jos se on yksilöllinen."
target_radius.label = "RADIUS-palvelin"
target_radius.help = "Käyttää porttia 1812."
target_snmp.label = "SNMP-laite"
target_snmp.help = "Käyttää porttia 161. Polku on luettava OID; oletus on sysUpTime (1.3.6.1.2.1.1.3.0)."
target_sqlserver.label = "SQL Server"
target_sqlserver.help = "Käyttää porttia 1433. Polku on tietokanta. Ilman käyttäjänimeä tarkistetaan vain pre-login. Salattu, kun palvelin pystyy; lisää ?encrypt=true&trustServerCertificate=false tarkistaaksesi myös varmenteen (tai encrypt=false, disable, strict)."
target_mongodb.label = "MongoDB-palvelin"
target_mongodb.help = "Käyttää porttia 27017. Luettele useita isäntiä pilkuilla tai käytä mongodb+srv://. Lisää ?tls=true TLS:ää varten (varmenne tarkistetaan; tlsAllowInvalidCertificates=true ohittaa sen) ja ?replicaSet= vaatiaksesi primary-solmun. Polku tai authSource on todennustietokanta (oletus admin)."
target_browser.label = "Sivun URL"
target_browser.help = "Sivu, jonka etäselain avaa, https:// mukaan lukien."
target_browser.placeholder = "https://shop.example.com/…"

