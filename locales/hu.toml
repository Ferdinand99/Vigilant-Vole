target_steam.label = "Kiszolgáló"
target_steam.help = "A 27015-ös portot használja, hacsak nem ad meg másikat."
target_game.label = "Játékszerver"
target_game.help = "A játékkal kezdődik: minecraft:// (25565-ös port; port nélkül először a _minecraft._tcp SRV rekordot próbálja), bedrock:// (19132), satisfactory:// (7777), fivem:// (30120, RedM is) vagy mumble:// (64738)."
target_tls.label = "Kiszolgáló"
target_tls.help = "A 443-as portot használja, hacsak nem ad meg másikat. Bármely szolgáltatással működik, amely az első bájttól TLS-t beszél (HTTPS, IMAPS, LDAPS, …)."
target_smtp.label = "Levelezőszerver"
target_smtp.help = "A 25-ös portot használja, hacsak nem ad meg másikat. A 465-ös port implicit TLS; a többit STARTTLS-re emeli, ha a kiszolgáló kínálja."
target_redis.label = "Redis-kiszolgáló"
target_redis.help = "A 6379-es portot használja. TLS-hez adja hozzá a rediss:// előtagot, adatbázis választásához pedig a /2 végződést."
target_postgres.label = "PostgreSQL-kiszolgáló"
target_postgres.help = "Az 5432-es portot használja. Az útvonal az adatbázis neve. TLS-t használ, ha a kiszolgáló kínálja; a tanúsítvány ellenőrzéséhez adja hozzá: ?sslmode=verify-full (vagy disable, require, verify-ca)."
target_mysql.label = "MySQL- vagy MariaDB-kiszolgáló"
target_mysql.help = "A 3306-os portot használja. Felhasználónév nélkül csak a kiszolgáló üdvözlését ellenőrzi. TLS-t használ, ha a kiszolgáló kínálja; a tanúsítvány ellenőrzéséhez adja hozzá: ?sslmode=verify-full."
target_mqtt.label = "MQTT-bróker"
target_mqtt.help = "Az 1883-as portot használja (mqtts://-nél 8883). Témára feliratkozáshoz adja meg útvonalként; a helyettesítő karakterek (+ és #) szó szerint működnek."
target_kafka.label = "Kafka-bróker"
target_kafka.help = "A 9092-es portot használja (kafkas://-nél 9093). Téma meglétének ellenőrzéséhez adja meg útvonalként."
target_rabbitmq.label = "RabbitMQ-bróker"
target_rabbitmq.help = "Az 5672-es portot használja (amqps://-nél 5671). Az útvonal a virtuális gazda; alapértelmezés: /."
target_grpc.label = "gRPC-kiszolgáló"
target_grpc.help = "Az 50051-es portot használja (grpcs://-nél 443). Az útvonal a szabványos állapotellenőrzés szolgáltatásneve; hagyja üresen a teljes kiszolgálóhoz."
target_grpc_keyword.label = "gRPC-metódus"
target_grpc_keyword.help = "Az 50051-es portot használja (grpcs:// esetén 443, ami a tanúsítványt is ellenőrzi). Az útvonal a szolgáltatás és a hívandó unary metódus; ha egyedi, elég a szolgáltatás rövid neve."
target_radius.label = "RADIUS-kiszolgáló"
target_radius.help = "Az 1812-es portot használja."
target_snmp.label = "SNMP-eszköz"
target_snmp.help = "A 161-es portot használja. Az útvonal az olvasandó OID; alapértelmezés: sysUpTime (1.3.6.1.2.1.1.3.0)."
target_sqlserver.label = "SQL Server"
target_sqlserver.help = "Az 1433-as portot használja. Az útvonal az adatbázis. Felhasználónév nélkül csak a bejelentkezés előtti szakaszt ellenőrzi. Titkosít, ha a szerver tudja; adja hozzá a ?encrypt=true&trustServerCertificate=false értéket a tanúsítvány ellenőrzéséhez is (vagy encrypt=false, disable, strict)."
target_mongodb.label = "MongoDB-szerver"
target_mongodb.help = "A 27017-es portot használja. Több gazdát vesszővel sorolhat fel, vagy használja a mongodb+srv:// formát. Adja hozzá a ?tls=true értéket a TLS-hez (a tanúsítványt ellenőrzi; a tlsAllowInvalidCertificates=true ezt kihagyja), és a ?replicaSet= értéket az elsődleges csomópont megkövetelésére. Az útvonal vagy az authSource a hitelesítési adatbázis (alapértelmezés: admin)."
target_browser.label = "Oldal URL-je"
target_browser.help = "A távoli böngésző által megnyitott oldal, https://-sel együtt."
target_browser.placeholder = "https://shop.example.com/…"

