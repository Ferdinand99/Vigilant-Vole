target_host.help = "Nazwa hosta lub adres IP."
target_tailscale.label = "Peer Tailscale"
target_tailscale.help = "Nazwa maszyny peera (jak w konsoli administracyjnej Tailscale), jego nazwa MagicDNS lub IP Tailscale, np. 100.64.0.5."
target_dns.label = "Nazwa do wyszukania"
target_dns.help = "Dla rekordów PTR wpisz adres IP."
target_docker.label = "Kontener"
target_docker.help = "Nazwa lub identyfikator kontenera."
target_domain.label = "Domena"
target_domain.help = "Subdomeny i adresy URL są sprowadzane do zarejestrowanej domeny."
target_ntp.label = "Serwer"
target_ntp.help = "Używa portu 123, chyba że dodasz inny."
target_steam.label = "Serwer"
target_steam.help = "Używa portu 27015, chyba że dodasz inny."
target_game.label = "Serwer gier"
target_game.help = "Zacznij od gry: minecraft:// (port 25565; bez portu najpierw próbowany jest rekord SRV _minecraft._tcp), bedrock:// (19132), satisfactory:// (7777), fivem:// (30120, także RedM) lub mumble:// (64738)."
target_tls.label = "Serwer"
target_tls.help = "Używa portu 443, chyba że dodasz inny. Działa dla każdej usługi mówiącej TLS od pierwszego bajtu (HTTPS, IMAPS, LDAPS, …)."
target_smtp.label = "Serwer poczty"
target_smtp.help = "Używa portu 25, chyba że dodasz inny. Port 465 jest traktowany jako niejawny TLS; na innych portach połączenie jest podnoszone przez STARTTLS, jeśli serwer to oferuje."
target_redis.label = "Serwer Redis"
target_redis.help = "Używa portu 6379. Dodaj rediss:// dla TLS i /2, aby wybrać bazę danych."
target_postgres.label = "Serwer PostgreSQL"
target_postgres.help = "Używa portu 5432. Ścieżka to nazwa bazy danych. TLS jest używany, gdy serwer go oferuje; dodaj ?sslmode=verify-full, aby sprawdzać też certyfikat (lub disable, require, verify-ca)."
target_mysql.label = "Serwer MySQL lub MariaDB"
target_mysql.help = "Używa portu 3306. Bez nazwy użytkownika sprawdzane jest tylko powitanie serwera. TLS jest używany, gdy serwer go oferuje; dodaj ?sslmode=verify-full, aby sprawdzać też certyfikat."
target_mqtt.label = "Broker MQTT"
target_mqtt.help = "Używa portu 1883 (8883 dla mqtts://). Dodaj temat jako ścieżkę, aby go subskrybować; symbole wieloznaczne (+ i #) działają tak, jak są wpisane."
target_kafka.label = "Broker Kafka"
target_kafka.help = "Używa portu 9092 (9093 dla kafkas://). Dodaj temat jako ścieżkę, aby sprawdzić, czy istnieje."
target_rabbitmq.label = "Broker RabbitMQ"
target_rabbitmq.help = "Używa portu 5672 (5671 dla amqps://). Ścieżka to host wirtualny; domyślny to /."
target_grpc.label = "Serwer gRPC"
target_grpc.help = "Używa portu 50051 (443 dla grpcs://). Ścieżka to nazwa usługi dla standardowej kontroli stanu; zostaw puste dla całego serwera."
target_grpc_keyword.label = "Metoda gRPC"
target_grpc_keyword.help = "Używa portu 50051 (443 dla grpcs://, które sprawdza też certyfikat). Ścieżka to usługa i metoda unarna do wywołania; krótka nazwa usługi działa, gdy jest jednoznaczna."
target_radius.label = "Serwer RADIUS"
target_radius.help = "Używa portu 1812."
target_snmp.label = "Urządzenie SNMP"
target_snmp.help = "Używa portu 161. Ścieżka to OID do odczytu; domyślny to sysUpTime (1.3.6.1.2.1.1.3.0)."
target_sqlserver.label = "SQL Server"
target_sqlserver.help = "Używa portu 1433. Ścieżka to baza danych. Bez nazwy użytkownika sprawdzane jest tylko pre-login. Szyfrowane, gdy serwer to potrafi; dodaj ?encrypt=true&trustServerCertificate=false, aby sprawdzić też certyfikat (lub encrypt=false, disable, strict)."
target_mongodb.label = "Serwer MongoDB"
target_mongodb.help = "Używa portu 27017. Kilka hostów podaj po przecinkach lub użyj mongodb+srv://. Dodaj ?tls=true dla TLS (certyfikat jest sprawdzany; tlsAllowInvalidCertificates=true to pomija) i ?replicaSet=, aby wymagać węzła głównego. Ścieżka lub authSource to baza uwierzytelniania (domyślnie admin)."
target_browser.label = "Adres strony"
target_browser.help = "Strona otwierana przez zdalną przeglądarkę, razem z https://."
target_browser.placeholder = "https://shop.example.com/…"

