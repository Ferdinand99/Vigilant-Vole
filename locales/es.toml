target_tls.help = "Usa el puerto 443 salvo que añadas otro. Sirve para cualquier servicio que hable TLS desde el primer byte (HTTPS, IMAPS, LDAPS…)."
target_smtp.label = "Servidor de correo"
target_smtp.help = "Usa el puerto 25 salvo que añadas otro. El puerto 465 se trata como TLS implícito; los demás puertos se elevan con STARTTLS cuando el servidor lo ofrece."
target_redis.label = "Servidor Redis"
target_redis.help = "Usa el puerto 6379. Añade rediss:// para TLS y /2 para elegir una base de datos."
target_postgres.label = "Servidor PostgreSQL"
target_postgres.help = "Usa el puerto 5432. La ruta es el nombre de la base de datos. Se usa TLS cuando el servidor lo ofrece; añade ?sslmode=verify-full para comprobar también el certificado (o disable, require, verify-ca)."
target_mysql.label = "Servidor MySQL o MariaDB"
target_mysql.help = "Usa el puerto 3306. Sin nombre de usuario, solo se comprueba el saludo del servidor. Se usa TLS cuando el servidor lo ofrece; añade ?sslmode=verify-full para comprobar también el certificado."
target_mqtt.label = "Broker MQTT"
target_mqtt.help = "Usa el puerto 1883 (8883 para mqtts://). Añade un tema como ruta para suscribirte a él; los comodines (+ y #) funcionan tal cual."
target_kafka.label = "Broker Kafka"
target_kafka.help = "Usa el puerto 9092 (9093 para kafkas://). Añade un tema como ruta para comprobar que existe."
target_rabbitmq.label = "Broker RabbitMQ"
target_rabbitmq.help = "Usa el puerto 5672 (5671 para amqps://). La ruta es el host virtual; el predeterminado es /."
target_grpc.label = "Servidor gRPC"
target_grpc.help = "Usa el puerto 50051 (443 para grpcs://). La ruta es el nombre del servicio para la comprobación de estado estándar; déjala vacía para todo el servidor."
target_grpc_keyword.label = "Método gRPC"
target_grpc_keyword.help = "Usa el puerto 50051 (443 para grpcs://, que también comprueba el certificado). La ruta es el servicio y el método unario al que llamar; sirve un nombre de servicio corto si es único."
target_radius.label = "Servidor RADIUS"
target_radius.help = "Usa el puerto 1812."
target_snmp.label = "Dispositivo SNMP"
target_snmp.help = "Usa el puerto 161. La ruta es el OID que leer; el predeterminado es sysUpTime (1.3.6.1.2.1.1.3.0)."
target_sqlserver.label = "SQL Server"
target_sqlserver.help = "Usa el puerto 1433. La ruta es la base de datos. Sin nombre de usuario solo se comprueba el pre-login. Cifrado cuando el servidor puede; añade ?encrypt=true&trustServerCertificate=false para comprobar también el certificado (o encrypt=false, disable, strict)."
target_mongodb.label = "Servidor MongoDB"
target_mongodb.help = "Usa el puerto 27017. Indica varios hosts separados por comas, o usa mongodb+srv://. Añade ?tls=true para TLS (se comprueba el certificado; tlsAllowInvalidCertificates=true lo omite) y ?replicaSet= para exigir un primario. La ruta o authSource es la base de datos de autenticación (admin por defecto)."
target_browser.label = "URL de la página"
target_browser.help = "La página que abre el navegador remoto, con https://."
target_browser.placeholder = "https://shop.example.com/…"

