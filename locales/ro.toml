target_ntp.help = "Folosește portul 123, dacă nu adaugi unul."
target_steam.label = "Server"
target_steam.help = "Folosește portul 27015, dacă nu adaugi unul."
target_game.label = "Server de joc"
target_game.help = "Începe cu jocul: minecraft:// (port 25565; fără port se încearcă mai întâi înregistrarea SRV _minecraft._tcp), bedrock:// (19132), satisfactory:// (7777), fivem:// (30120, inclusiv RedM) sau mumble:// (64738)."
target_tls.label = "Server"
target_tls.help = "Folosește portul 443, dacă nu adaugi unul. Funcționează pentru orice serviciu care vorbește TLS de la primul octet (HTTPS, IMAPS, LDAPS, …)."
target_smtp.label = "Server de e-mail"
target_smtp.help = "Folosește portul 25, dacă nu adaugi unul. Portul 465 este tratat ca TLS implicit; celelalte porturi sunt trecute la STARTTLS când serverul îl oferă."
target_redis.label = "Server Redis"
target_redis.help = "Folosește portul 6379. Adaugă rediss:// pentru TLS și /2 pentru a alege o bază de date."
target_postgres.label = "Server PostgreSQL"
target_postgres.help = "Folosește portul 5432. Calea este numele bazei de date. TLS este folosit când serverul îl oferă; adaugă ?sslmode=verify-full pentru a verifica și certificatul (sau disable, require, verify-ca)."
target_mysql.label = "Server MySQL sau MariaDB"
target_mysql.help = "Folosește portul 3306. Fără nume de utilizator se verifică doar salutul serverului. TLS este folosit când serverul îl oferă; adaugă ?sslmode=verify-full pentru a verifica și certificatul."
target_mqtt.label = "Broker MQTT"
target_mqtt.help = "Folosește portul 1883 (8883 pentru mqtts://). Adaugă un subiect (topic) ca cale pentru a te abona la el; metacaracterele (+ și #) funcționează ca atare."
target_kafka.label = "Broker Kafka"
target_kafka.help = "Folosește portul 9092 (9093 pentru kafkas://). Adaugă un subiect (topic) ca cale pentru a verifica dacă există."
target_rabbitmq.label = "Broker RabbitMQ"
target_rabbitmq.help = "Folosește portul 5672 (5671 pentru amqps://). Calea este gazda virtuală; implicit este /."
target_grpc.label = "Server gRPC"
target_grpc.help = "Folosește portul 50051 (443 pentru grpcs://). Calea este numele serviciului pentru verificarea standard de sănătate; lasă gol pentru întregul server."
target_grpc_keyword.label = "Metodă gRPC"
target_grpc_keyword.help = "Folosește portul 50051 (443 pentru grpcs://, care verifică și certificatul). Calea este serviciul și metoda unară de apelat; un nume scurt de serviciu funcționează dacă este unic."
target_radius.label = "Server RADIUS"
target_radius.help = "Folosește portul 1812."
target_snmp.label = "Dispozitiv SNMP"
target_snmp.help = "Folosește portul 161. Calea este OID-ul de citit; implicit este sysUpTime (1.3.6.1.2.1.1.3.0)."
target_sqlserver.label = "SQL Server"
target_sqlserver.help = "Folosește portul 1433. Calea este baza de date. Fără nume de utilizator se verifică doar pre-login. Criptat când serverul poate; adaugă ?encrypt=true&trustServerCertificate=false pentru a verifica și certificatul (sau encrypt=false, disable, strict)."
target_mongodb.label = "Server MongoDB"
target_mongodb.help = "Folosește portul 27017. Enumeră mai multe gazde separate prin virgulă sau folosește mongodb+srv://. Adaugă ?tls=true pentru TLS (certificatul este verificat; tlsAllowInvalidCertificates=true omite verificarea) și ?replicaSet= pentru a cere un primar. Calea sau authSource este baza de date de autentificare (implicit admin)."
target_browser.label = "URL pagină"
target_browser.help = "Pagina pe care o deschide browserul la distanță, inclusiv https://."
target_browser.placeholder = "https://shop.example.com/…"

