target_url.label = "URL"
target_url.help = "L’adresse complète, avec https://."
target_ws.label = "URL"
target_ws.help = "Une adresse ws:// ou wss://. http(s):// fonctionne aussi."
target_hostport.label = "Hôte et port"
target_hostport.help = "Mettre les adresses IPv6 entre crochets, par exemple [2001:db8::1]:443."
target_host.label = "Hôte"
target_host.help = "Un nom d’hôte ou une adresse IP."
target_tailscale.label = "Pair Tailscale"
target_tailscale.help = "Le nom de la machine du pair (comme dans la console d’administration Tailscale), son nom MagicDNS ou une IP Tailscale comme 100.64.0.5."
target_dns.label = "Nom à résoudre"
target_dns.help = "Pour les enregistrements PTR, saisir l’adresse IP."
target_docker.label = "Conteneur"
target_docker.help = "Le nom ou l’ID du conteneur."
target_domain.label = "Domaine"
target_domain.help = "Les sous-domaines et URL sont ramenés au domaine enregistré."
target_ntp.label = "Serveur"
target_ntp.help = "Utilise le port 123 sauf indication contraire."
target_steam.label = "Serveur"
target_steam.help = "Utilise le port 27015 sauf indication contraire."
target_game.label = "Serveur de jeu"
target_game.help = "Commencer par le jeu : minecraft:// (port 25565 ; sans port, l’enregistrement SRV _minecraft._tcp est essayé d’abord), bedrock:// (19132), satisfactory:// (7777), fivem:// (30120, aussi RedM) ou mumble:// (64738)."
target_tls.label = "Serveur"
target_tls.help = "Utilise le port 443 sauf indication contraire. Convient à tout service parlant TLS dès le premier octet (HTTPS, IMAPS, LDAPS, …)."
target_smtp.label = "Serveur de messagerie"
target_smtp.help = "Utilise le port 25 sauf indication contraire. Le port 465 est traité comme TLS implicite ; les autres ports passent en STARTTLS si le serveur le propose."
target_redis.label = "Serveur Redis"
target_redis.help = "Utilise le port 6379. Ajouter rediss:// pour TLS et /2 pour choisir une base."
target_postgres.label = "Serveur PostgreSQL"
target_postgres.help = "Utilise le port 5432. Le chemin est le nom de la base. TLS est utilisé si le serveur le propose ; ajouter ?sslmode=verify-full pour vérifier aussi le certificat (ou disable, require, verify-ca)."
target_mysql.label = "Serveur MySQL ou MariaDB"
target_mysql.help = "Utilise le port 3306. Sans nom d’utilisateur, seul l’accueil du serveur est vérifié. TLS est utilisé si le serveur le propose ; ajouter ?sslmode=verify-full pour vérifier aussi le certificat."
target_mqtt.label = "Broker MQTT"
target_mqtt.help = "Utilise le port 1883 (8883 pour mqtts://). Ajouter un sujet comme chemin pour s’y abonner ; les jokers (+ et #) fonctionnent tels quels."
target_kafka.label = "Broker Kafka"
target_kafka.help = "Utilise le port 9092 (9093 pour kafkas://). Ajouter un sujet comme chemin pour vérifier qu’il existe."
target_rabbitmq.label = "Broker RabbitMQ"
target_rabbitmq.help = "Utilise le port 5672 (5671 pour amqps://). Le chemin est l’hôte virtuel ; par défaut /."
target_grpc.label = "Serveur gRPC"
target_grpc.help = "Utilise le port 50051 (443 pour grpcs://). Le chemin est le nom du service pour le contrôle d’état standard ; laisser vide pour tout le serveur."
target_grpc_keyword.label = "Méthode gRPC"
target_grpc_keyword.help = "Utilise le port 50051 (443 pour grpcs://, qui vérifie aussi le certificat). Le chemin est le service et la méthode unaire à appeler ; un nom de service court suffit s’il est unique."
target_radius.label = "Serveur RADIUS"
target_radius.help = "Utilise le port 1812."
target_snmp.label = "Appareil SNMP"
target_snmp.help = "Utilise le port 161. Le chemin est l’OID à lire ; par défaut sysUpTime (1.3.6.1.2.1.1.3.0)."
target_sqlserver.label = "SQL Server"
target_sqlserver.help = "Utilise le port 1433. Le chemin est la base de données. Sans nom d’utilisateur, seul le pre-login est vérifié. Chiffré quand le serveur le peut ; ajouter ?encrypt=true&trustServerCertificate=false pour vérifier aussi le certificat (ou encrypt=false, disable, strict)."
target_mongodb.label = "Serveur MongoDB"
target_mongodb.help = "Utilise le port 27017. Lister plusieurs hôtes séparés par des virgules, ou utiliser mongodb+srv://. Ajouter ?tls=true pour TLS (le certificat est vérifié ; tlsAllowInvalidCertificates=true l’ignore) et ?replicaSet= pour exiger un primaire. Le chemin ou authSource est la base d’authentification (admin par défaut)."
target_browser.label = "URL de la page"
target_browser.help = "La page que le navigateur distant ouvre, https:// compris."
target_browser.placeholder = "https://shop.example.com/…"

