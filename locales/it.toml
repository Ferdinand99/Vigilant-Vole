target_docker.help = "Il nome o l’ID del container."
target_domain.label = "Dominio"
target_domain.help = "Sottodomini e URL vengono ridotti al dominio registrato."
target_ntp.label = "Server"
target_ntp.help = "Usa la porta 123 se non ne aggiungi una."
target_steam.label = "Server"
target_steam.help = "Usa la porta 27015 se non ne aggiungi una."
target_game.label = "Server di gioco"
target_game.help = "Inizia con il gioco: minecraft:// (porta 25565; senza porta si prova prima il record SRV _minecraft._tcp), bedrock:// (19132), satisfactory:// (7777), fivem:// (30120, anche RedM) o mumble:// (64738)."
target_tls.label = "Server"
target_tls.help = "Usa la porta 443 se non ne aggiungi una. Funziona con qualsiasi servizio che parla TLS dal primo byte (HTTPS, IMAPS, LDAPS, …)."
target_smtp.label = "Server di posta"
target_smtp.help = "Usa la porta 25 se non ne aggiungi una. La porta 465 è trattata come TLS implicito; le altre porte passano a STARTTLS quando il server lo offre."
target_redis.label = "Server Redis"
target_redis.help = "Usa la porta 6379. Aggiungi rediss:// per TLS e /2 per scegliere un database."
target_postgres.label = "Server PostgreSQL"
target_postgres.help = "Usa la porta 5432. Il percorso è il nome del database. TLS viene usato quando il server lo offre; aggiungi ?sslmode=verify-full per verificare anche il certificato (oppure disable, require, verify-ca)."
target_mysql.label = "Server MySQL o MariaDB"
target_mysql.help = "Usa la porta 3306. Senza nome utente viene controllato solo il saluto del server. TLS viene usato quando il server lo offre; aggiungi ?sslmode=verify-full per verificare anche il certificato."
target_mqtt.label = "Broker MQTT"
target_mqtt.help = "Usa la porta 1883 (8883 per mqtts://). Aggiungi un topic come percorso per iscriverti; i caratteri jolly (+ e #) funzionano così come sono."
target_kafka.label = "Broker Kafka"
target_kafka.help = "Usa la porta 9092 (9093 per kafkas://). Aggiungi un topic come percorso per verificare che esista."
target_rabbitmq.label = "Broker RabbitMQ"
target_rabbitmq.help = "Usa la porta 5672 (5671 per amqps://). Il percorso è il virtual host; quello predefinito è /."
target_grpc.label = "Server gRPC"
target_grpc.help = "Usa la porta 50051 (443 per grpcs://). Il percorso è il nome del servizio per il controllo di integrità standard; lascia vuoto per l’intero server."
target_grpc_keyword.label = "Metodo gRPC"
target_grpc_keyword.help = "Usa la porta 50051 (443 per grpcs://, che verifica anche il certificato). Il percorso indica il servizio e il metodo unary da chiamare; un nome di servizio breve funziona se è univoco."
target_radius.label = "Server RADIUS"
target_radius.help = "Usa la porta 1812."
target_snmp.label = "Dispositivo SNMP"
target_snmp.help = "Usa la porta 161. Il percorso è l’OID da leggere; quello predefinito è sysUpTime (1.3.6.1.2.1.1.3.0)."
target_sqlserver.label = "SQL Server"
target_sqlserver.help = "Usa la porta 1433. Il percorso è il database. Senza nome utente viene verificato solo il pre-login. Cifrato quando il server può; aggiungi ?encrypt=true&trustServerCertificate=false per verificare anche il certificato (oppure encrypt=false, disable, strict)."
target_mongodb.label = "Server MongoDB"
target_mongodb.help = "Usa la porta 27017. Elenca più host con le virgole oppure usa mongodb+srv://. Aggiungi ?tls=true per TLS (il certificato viene verificato; tlsAllowInvalidCertificates=true lo salta) e ?replicaSet= per richiedere un primary. Il percorso o authSource è il database di autenticazione (predefinito admin)."
target_browser.label = "URL della pagina"
target_browser.help = "La pagina che il browser remoto apre, incluso https://."
target_browser.placeholder = "https://shop.example.com/…"

