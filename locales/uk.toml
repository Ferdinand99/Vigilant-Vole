target_grpc_keyword.label = "Метод gRPC"
target_grpc_keyword.help = "Використовує порт 50051 (443 для grpcs://, що також перевіряє сертифікат). Шлях — це сервіс і унарний метод для виклику; коротка назва сервісу працює, якщо вона унікальна."
target_radius.label = "Сервер RADIUS"
