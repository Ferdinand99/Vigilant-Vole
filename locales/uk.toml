target_sqlserver.label = "SQL Server"
target_sqlserver.help = "Використовує порт 1433. Шлях — це база даних. Без імені користувача перевіряється лише pre-login. Шифрується, коли сервер це вміє; додайте ?encrypt=true&trustServerCertificate=false, щоб також перевіряти сертифікат (або encrypt=false, disable, strict)."
target_mongodb.label = "Сервер MongoDB"
target_mongodb.help = "Використовує порт 27017. Вкажіть кілька хостів через коми або використайте mongodb+srv://. Додайте ?tls=true для TLS (сертифікат перевіряється; tlsAllowInvalidCertificates=true це вимикає) і ?replicaSet=, щоб вимагати primary. Шлях або authSource — це база даних автентифікації (типово admin)."
