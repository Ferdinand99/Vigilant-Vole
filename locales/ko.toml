target_game.label = "게임 서버"
target_game.help = "게임으로 시작하세요: minecraft://(포트 25565, 포트가 없으면 _minecraft._tcp SRV 레코드를 먼저 시도), bedrock://(19132), satisfactory://(7777), fivem://(30120, RedM 포함), mumble://(64738)."
target_tls.label = "서버"
target_tls.help = "포트를 추가하지 않으면 443번을 사용해요. 첫 바이트부터 TLS를 사용하는 모든 서비스(HTTPS, IMAPS, LDAPS …)에서 작동해요."
target_smtp.label = "메일 서버"
target_smtp.help = "포트를 추가하지 않으면 25번을 사용해요. 465번 포트는 암시적 TLS로 처리하고, 다른 포트는 서버가 지원하면 STARTTLS로 업그레이드해요."
target_redis.label = "Redis 서버"
target_redis.help = "6379번 포트를 사용해요. TLS는 rediss://를, 데이터베이스 선택은 /2를 추가하세요."
target_postgres.label = "PostgreSQL 서버"
target_postgres.help = "5432번 포트를 사용해요. 경로는 데이터베이스 이름이에요. 서버가 지원하면 TLS를 사용해요. 인증서까지 확인하려면 ?sslmode=verify-full을 추가하세요 (disable, require, verify-ca도 가능)."
target_mysql.label = "MySQL 또는 MariaDB 서버"
target_mysql.help = "3306번 포트를 사용해요. 사용자 이름이 없으면 서버 인사말만 확인해요. 서버가 지원하면 TLS를 사용해요. 인증서까지 확인하려면 ?sslmode=verify-full을 추가하세요."
target_mqtt.label = "MQTT 브로커"
target_mqtt.help = "1883번 포트를 사용해요 (mqtts://는 8883). 경로로 토픽을 추가하면 구독해요. 와일드카드(+와 #)는 그대로 작동해요."
target_kafka.label = "Kafka 브로커"
target_kafka.help = "9092번 포트를 사용해요 (kafkas://는 9093). 경로로 토픽을 추가하면 존재 여부를 확인해요."
target_rabbitmq.label = "RabbitMQ 브로커"
target_rabbitmq.help = "5672번 포트를 사용해요 (amqps://는 5671). 경로는 가상 호스트이고 기본값은 /예요."
target_grpc.label = "gRPC 서버"
target_grpc.help = "50051번 포트를 사용해요 (grpcs://는 443). 경로는 표준 상태 확인의 서비스 이름이에요. 서버 전체를 확인하려면 비워 두세요."
target_grpc_keyword.label = "gRPC 메서드"
target_grpc_keyword.help = "포트 50051을 사용해요(grpcs://는 443이며 인증서도 확인). 경로는 서비스와 호출할 단항 메서드예요. 고유하다면 짧은 서비스 이름도 쓸 수 있어요."
target_radius.label = "RADIUS 서버"
target_radius.help = "1812번 포트를 사용해요."
target_snmp.label = "SNMP 장치"
target_snmp.help = "161번 포트를 사용해요. 경로는 읽을 OID이며 기본값은 sysUpTime (1.3.6.1.2.1.1.3.0)이에요."
target_sqlserver.label = "SQL Server"
target_sqlserver.help = "포트 1433을 사용해요. 경로는 데이터베이스예요. 사용자 이름이 없으면 사전 로그인만 확인해요. 서버가 지원하면 암호화해요. 인증서도 확인하려면 ?encrypt=true&trustServerCertificate=false를 추가하세요(또는 encrypt=false, disable, strict)."
target_mongodb.label = "MongoDB 서버"
target_mongodb.help = "포트 27017을 사용해요. 호스트를 쉼표로 여러 개 나열하거나 mongodb+srv://를 사용하세요. TLS는 ?tls=true(인증서를 확인하며, tlsAllowInvalidCertificates=true로 건너뜀), 프라이머리를 요구하려면 ?replicaSet=을 추가하세요. 경로 또는 authSource는 인증 데이터베이스예요(기본값 admin)."
target_browser.label = "페이지 URL"
target_browser.help = "원격 브라우저가 열 페이지예요. https://를 포함하세요."
target_browser.placeholder = "https://shop.example.com/…"

