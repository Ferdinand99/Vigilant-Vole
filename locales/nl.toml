target_dns.help = "Voer voor PTR-records het IP-adres in."
target_docker.label = "Container"
target_docker.help = "De naam of het ID van de container."
target_domain.label = "Domein"
target_domain.help = "Subdomeinen en URL’s worden teruggebracht tot het geregistreerde domein."
target_ntp.label = "Server"
target_ntp.help = "Gebruikt poort 123 tenzij je er een opgeeft."
target_steam.label = "Server"
target_steam.help = "Gebruikt poort 27015 tenzij je er een opgeeft."
target_game.label = "Gameserver"
target_game.help = "Begin met de game: minecraft:// (poort 25565; zonder poort wordt eerst het _minecraft._tcp SRV-record geprobeerd), bedrock:// (19132), satisfactory:// (7777), fivem:// (30120, ook RedM) of mumble:// (64738)."
target_tls.label = "Server"
target_tls.help = "Gebruikt poort 443 tenzij je er een opgeeft. Werkt voor elke dienst die vanaf de eerste byte TLS spreekt (HTTPS, IMAPS, LDAPS, …)."
target_smtp.label = "Mailserver"
target_smtp.help = "Gebruikt poort 25 tenzij je er een opgeeft. Poort 465 wordt behandeld als impliciete TLS; andere poorten worden met STARTTLS opgewaardeerd als de server dat aanbiedt."
target_redis.label = "Redis-server"
target_redis.help = "Gebruikt poort 6379. Voeg rediss:// toe voor TLS en /2 om een database te kiezen."
target_postgres.label = "PostgreSQL-server"
target_postgres.help = "Gebruikt poort 5432. Het pad is de databasenaam. TLS wordt gebruikt als de server het aanbiedt; voeg ?sslmode=verify-full toe om ook het certificaat te controleren (of disable, require, verify-ca)."
target_mysql.label = "MySQL- of MariaDB-server"
target_mysql.help = "Gebruikt poort 3306. Zonder gebruikersnaam wordt alleen de begroeting van de server gecontroleerd. TLS wordt gebruikt als de server het aanbiedt; voeg ?sslmode=verify-full toe om ook het certificaat te controleren."
target_mqtt.label = "MQTT-broker"
target_mqtt.help = "Gebruikt poort 1883 (8883 voor mqtts://). Voeg een topic als pad toe om je erop te abonneren; wildcards (+ en #) werken zoals ze er staan."
target_kafka.label = "Kafka-broker"
target_kafka.help = "Gebruikt poort 9092 (9093 voor kafkas://). Voeg een topic als pad toe om te controleren of het bestaat."
target_rabbitmq.label = "RabbitMQ-broker"
target_rabbitmq.help = "Gebruikt poort 5672 (5671 voor amqps://). Het pad is de virtuele host; standaard is dat /."
target_grpc.label = "gRPC-server"
target_grpc.help = "Gebruikt poort 50051 (443 voor grpcs://). Het pad is de servicenaam voor de standaard gezondheidscontrole; laat leeg voor de hele server."
target_grpc_keyword.label = "gRPC-methode"
target_grpc_keyword.help = "Gebruikt poort 50051 (443 voor grpcs://, dat ook het certificaat controleert). Het pad is de service en de unary-methode die wordt aangeroepen; een korte servicenaam werkt als die uniek is."
target_radius.label = "RADIUS-server"
target_radius.help = "Gebruikt poort 1812."
target_snmp.label = "SNMP-apparaat"
target_snmp.help = "Gebruikt poort 161. Het pad is de OID die wordt gelezen; standaard is dat sysUpTime (1.3.6.1.2.1.1.3.0)."
target_sqlserver.label = "SQL Server"
target_sqlserver.help = "Gebruikt poort 1433. Het pad is de database. Zonder gebruikersnaam wordt alleen de pre-login gecontroleerd. Versleuteld als de server dat kan; voeg ?encrypt=true&trustServerCertificate=false toe om ook het certificaat te controleren (of encrypt=false, disable, strict)."
target_mongodb.label = "MongoDB-server"
target_mongodb.help = "Gebruikt poort 27017. Geef meerdere hosts op met komma’s, of gebruik mongodb+srv://. Voeg ?tls=true toe voor TLS (het certificaat wordt gecontroleerd; tlsAllowInvalidCertificates=true slaat dat over) en ?replicaSet= om een primary te eisen. Het pad of authSource is de authenticatiedatabase (standaard admin)."
target_browser.label = "Pagina-URL"
target_browser.help = "De pagina die de externe browser opent, inclusief https://."
target_browser.placeholder = "https://shop.example.com/…"

