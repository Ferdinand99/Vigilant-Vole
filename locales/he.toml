[tailscale]
ping_type = "סוג ping"
ping_type_help = "Disco בודק את נתיב Tailscale עצמו, כמו tailscale ping. TSMP עובר דרך WireGuard אל Tailscale בעמית, ו-ICMP עובר גם דרך מחסנית הרשת של העמית."
socket_title = "נדרש socket של tailscaled מהמארח"
socket_text = "הבדיקה מבקשת מ-tailscaled המקומי לבצע ping. ב-Docker יש לטעון (mount) את /var/run/tailscale/tailscaled.sock מהמארח (או להגדיר VV_TAILSCALE_SOCKET). Vigilant Vole רק קורא את הסטטוס ומבצע ping, אבל תהליך root עם ה-socket יכול לשנות את ההגדרות של Tailscale, ולכן יש לטעון אותו רק לקונטיינר מהימן."

