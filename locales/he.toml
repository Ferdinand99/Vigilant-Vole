target_tls.label = "שרת"
target_tls.help = "משתמש בפורט 443 אלא אם מוסיפים פורט. מתאים לכל שירות שמדבר TLS מהבייט הראשון (HTTPS, IMAPS, LDAPS, …)."
target_smtp.label = "שרת דואר"
target_smtp.help = "משתמש בפורט 25 אלא אם מוסיפים פורט. פורט 465 נחשב TLS מובלע; בפורטים אחרים עוברים ל-STARTTLS כששרת מציע זאת."
target_redis.label = "שרת Redis"
target_redis.help = "משתמש בפורט 6379. יש להוסיף rediss:// ל-TLS ו-/2 לבחירת מסד נתונים."
target_postgres.label = "שרת PostgreSQL"
target_postgres.help = "משתמש בפורט 5432. הנתיב הוא שם מסד הנתונים. TLS משמש כששרת מציע אותו; יש להוסיף ?sslmode=verify-full כדי לבדוק גם את התעודה (או disable, require, verify-ca)."
target_mysql.label = "שרת MySQL או MariaDB"
target_mysql.help = "משתמש בפורט 3306. בלי שם משתמש נבדקת רק ברכת השרת. TLS משמש כששרת מציע אותו; יש להוסיף ?sslmode=verify-full כדי לבדוק גם את התעודה."
target_mqtt.label = "ה-broker של MQTT"
target_mqtt.help = "משתמש בפורט 1883 (8883 ל-mqtts://). יש להוסיף נושא כנתיב כדי להירשם אליו; תווים כלליים (+ ו-#) פועלים כפי שהם."
target_kafka.label = "ה-broker של Kafka"
target_kafka.help = "משתמש בפורט 9092 (9093 ל-kafkas://). יש להוסיף נושא כנתיב כדי לבדוק שהוא קיים."
target_rabbitmq.label = "ה-broker של RabbitMQ"
target_rabbitmq.help = "משתמש בפורט 5672 (5671 ל-amqps://). הנתיב הוא ה-virtual host; ברירת המחדל היא /."
target_grpc.label = "שרת gRPC"
target_grpc.help = "משתמש בפורט 50051 (443 ל-grpcs://). הנתיב הוא שם השירות לבדיקת התקינות הסטנדרטית; אם ריק, נבדק השרת כולו."
target_grpc_keyword.label = "מתודת gRPC"
target_grpc_keyword.help = "משתמש בפורט 50051 (443 עבור grpcs://, שגם בודק את התעודה). הנתיב הוא השירות והמתודה האונרית לקריאה; שם שירות קצר מספיק כשהוא ייחודי."
target_radius.label = "שרת RADIUS"
target_radius.help = "משתמש בפורט 1812."
target_snmp.label = "מכשיר SNMP"
target_snmp.help = "משתמש בפורט 161. הנתיב הוא ה-OID לקריאה; ברירת המחדל היא sysUpTime (1.3.6.1.2.1.1.3.0)."
target_sqlserver.label = "SQL Server"
target_sqlserver.help = "משתמש בפורט 1433. הנתיב הוא מסד הנתונים. ללא שם משתמש נבדק רק ה-pre-login. מוצפן כשהשרת יכול; יש להוסיף ?encrypt=true&trustServerCertificate=false כדי לבדוק גם את התעודה (או encrypt=false, disable, strict)."
target_mongodb.label = "שרת MongoDB"
target_mongodb.help = "משתמש בפורט 27017. אפשר לרשום כמה מארחים עם פסיקים, או להשתמש ב-mongodb+srv://. יש להוסיף ?tls=true עבור TLS (התעודה נבדקת; tlsAllowInvalidCertificates=true מדלג על כך) ו-?replicaSet= כדי לדרוש primary. הנתיב או authSource הוא מסד נתוני האימות (ברירת מחדל admin)."
target_browser.label = "כתובת הדף"
target_browser.help = "הדף שהדפדפן המרוחק פותח, כולל https://."
target_browser.placeholder = "https://shop.example.com/…"

