section_sub = "סוגי ההודעות של המתודה נלקחים מקובץ ה-.proto שלך, או מהשרת עצמו כשהשדה ריק."
proto = "הגדרת .proto"
proto_help = "יש להדביק את קובץ ה-.proto שמגדיר את השירות. ייבוא של google/protobuf/*.proto עובד; ייבוא אחר אינו עובד, ולכן יש להדביק קובץ עצמאי אחד. יש להשאיר ריק כדי לשאול את השרת (server reflection חייב להיות מופעל)."
