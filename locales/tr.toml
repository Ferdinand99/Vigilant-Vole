target_mysql.help = "3306 numaralı bağlantı noktasını kullanır. Kullanıcı adı olmadan yalnızca sunucu karşılaması denetlenir. Sunucu sunuyorsa TLS kullanılır; sertifikayı da denetlemek için ?sslmode=verify-full ekleyin."
target_mqtt.label = "MQTT aracısı"
target_mqtt.help = "1883 numaralı bağlantı noktasını kullanır (mqtts:// için 8883). Abone olmak için yol olarak bir konu ekleyin; joker karakterler (+ ve #) yazıldığı gibi çalışır."
target_kafka.label = "Kafka aracısı"
target_kafka.help = "9092 numaralı bağlantı noktasını kullanır (kafkas:// için 9093). Var olduğunu denetlemek için yol olarak bir konu ekleyin."
target_rabbitmq.label = "RabbitMQ aracısı"
target_rabbitmq.help = "5672 numaralı bağlantı noktasını kullanır (amqps:// için 5671). Yol, sanal ana makinedir; varsayılan /."
target_grpc.label = "gRPC sunucusu"
target_grpc.help = "50051 numaralı bağlantı noktasını kullanır (grpcs:// için 443). Yol, standart sağlık kontrolü için hizmet adıdır; tüm sunucu için boş bırakın."
target_grpc_keyword.label = "gRPC yöntemi"
target_grpc_keyword.help = "50051 portunu kullanır (grpcs:// için 443; sertifikayı da denetler). Yol, çağrılacak hizmet ve unary yöntemdir; benzersizse kısa bir hizmet adı da çalışır."
target_radius.label = "RADIUS sunucusu"
target_radius.help = "1812 numaralı bağlantı noktasını kullanır."
target_snmp.label = "SNMP cihazı"
target_snmp.help = "161 numaralı bağlantı noktasını kullanır. Yol, okunacak OID’dir; varsayılan sysUpTime (1.3.6.1.2.1.1.3.0)."
target_sqlserver.label = "SQL Server"
target_sqlserver.help = "1433 portunu kullanır. Yol, veritabanıdır. Kullanıcı adı yoksa yalnızca ön oturum açma denetlenir. Sunucu destekliyorsa şifrelenir; sertifikayı da denetlemek için ?encrypt=true&trustServerCertificate=false ekleyin (veya encrypt=false, disable, strict)."
target_mongodb.label = "MongoDB sunucusu"
target_mongodb.help = "27017 portunu kullanır. Birden fazla ana makineyi virgülle sıralayın veya mongodb+srv:// kullanın. TLS için ?tls=true ekleyin (sertifika denetlenir; tlsAllowInvalidCertificates=true bunu atlar) ve birincil düğümü zorunlu kılmak için ?replicaSet= ekleyin. Yol veya authSource, kimlik doğrulama veritabanıdır (varsayılan admin)."
target_browser.label = "Sayfa URL’si"
target_browser.help = "Uzak tarayıcının açtığı sayfa, https:// dahil."
target_browser.placeholder = "https://shop.example.com/…"

