[tailscale]
ping_type = "Ping-type"
ping_type_help = "Disco tester selve Tailscale-veien, som tailscale ping. TSMP går gjennom WireGuard til Tailscale på noden, ICMP også gjennom nettverksstakken til noden."
socket_title = "Trenger tailscaled-socketen til verten"
socket_text = "Sjekken ber den lokale tailscaled om å pinge. I Docker monterer du /var/run/tailscale/tailscaled.sock fra verten (eller setter VV_TAILSCALE_SOCKET). Vigilant Vole leser bare status og pinger, men en root-prosess med socketen kan endre Tailscale-innstillingene, så monter den bare i en container du stoler på."

[target]
target_url.label = "URL"
target_url.help = "Hele adressen, med https://."
target_ws.label = "URL"
target_ws.help = "En ws://- eller wss://-adresse. http(s):// fungerer også."
target_hostport.label = "Vert og port"
target_hostport.help = "Sett IPv6-adresser i hakeparentes, for eksempel [2001:db8::1]:443."
target_host.label = "Vert"
target_host.help = "Et vertsnavn eller en IP-adresse."
target_tailscale.label = "Tailscale-node"
target_tailscale.help = "Maskinnavnet til noden (som i Tailscale-administrasjonen), MagicDNS-navnet eller en Tailscale-IP som 100.64.0.5."
target_dns.label = "Navn som skal slås opp"
target_dns.help = "For PTR-poster skriver du inn IP-adressen."
target_docker.label = "Container"
target_docker.help = "Navnet eller ID-en til containeren."
target_domain.label = "Domene"
target_domain.help = "Underdomener og URL-er kortes ned til det registrerte domenet."
target_ntp.label = "Server"
target_ntp.help = "Bruker port 123 med mindre du angir en annen."
target_steam.label = "Server"
target_steam.help = "Bruker port 27015 med mindre du angir en annen."
target_game.label = "Spillserver"
target_game.help = "Start med spillet: minecraft:// (port 25565; uten port prøves SRV-posten _minecraft._tcp først), bedrock:// (19132), satisfactory:// (7777), fivem:// (30120, også RedM) eller mumble:// (64738)."
target_tls.label = "Server"
target_tls.help = "Bruker port 443 med mindre du angir en annen. Fungerer for alle tjenester som snakker TLS fra første byte (HTTPS, IMAPS, LDAPS, …)."
target_smtp.label = "Mailserver"
target_smtp.help = "Bruker port 25 med mindre du angir en annen. Port 465 regnes som implisitt TLS; andre porter oppgraderes med STARTTLS når serveren tilbyr det."
target_redis.label = "Redis-server"
target_redis.help = "Bruker port 6379. Legg til rediss:// for TLS og /2 for å velge database."
target_postgres.label = "PostgreSQL-server"
target_postgres.help = "Bruker port 5432. Stien er databasenavnet. TLS brukes når serveren tilbyr det; legg til ?sslmode=verify-full for også å sjekke sertifikatet (eller disable, require, verify-ca)."
target_mysql.label = "MySQL- eller MariaDB-server"
target_mysql.help = "Bruker port 3306. Uten brukernavn sjekkes bare hilsenen fra serveren. TLS brukes når serveren tilbyr det; legg til ?sslmode=verify-full for også å sjekke sertifikatet."
target_mqtt.label = "MQTT-megler"
target_mqtt.help = "Bruker port 1883 (8883 for mqtts://). Legg til et emne som sti for å abonnere på det; jokertegn (+ og #) virker som skrevet."
target_kafka.label = "Kafka-megler"
target_kafka.help = "Bruker port 9092 (9093 for kafkas://). Legg til et emne som sti for å sjekke at det finnes."
target_rabbitmq.label = "RabbitMQ-megler"
target_rabbitmq.help = "Bruker port 5672 (5671 for amqps://). Stien er den virtuelle verten; standard er /."
target_grpc.label = "gRPC-server"
target_grpc.help = "Bruker port 50051 (443 for grpcs://). Stien er tjenestenavnet for standard helsesjekk; la den stå tom for hele serveren."
target_grpc_keyword.label = "gRPC-metode"
target_grpc_keyword.help = "Bruker port 50051 (443 for grpcs://, som også sjekker sertifikatet). Stien er tjenesten og den unære metoden som skal kalles; et kort tjenestenavn holder når det er entydig."
target_radius.label = "RADIUS-server"
target_radius.help = "Bruker port 1812."
target_snmp.label = "SNMP-enhet"
target_snmp.help = "Bruker port 161. Stien er OID-en som leses; standard er sysUpTime (1.3.6.1.2.1.1.3.0)."
target_sqlserver.label = "SQL Server"
target_sqlserver.help = "Bruker port 1433. Stien er databasen. Uten brukernavn sjekkes bare forhåndspåloggingen. Krypteres når serveren kan; legg til ?encrypt=true&trustServerCertificate=false for også å sjekke sertifikatet (eller encrypt=false, disable, strict)."
target_mongodb.label = "MongoDB-server"
target_mongodb.help = "Bruker port 27017. Oppgi flere verter med komma, eller bruk mongodb+srv://. Legg til ?tls=true for TLS (sertifikatet sjekkes; tlsAllowInvalidCertificates=true hopper over det) og ?replicaSet= for å kreve en primærnode. Stien eller authSource er autentiseringsdatabasen (standard admin)."
target_browser.label = "Sidens URL"
target_browser.help = "Siden den eksterne nettleseren åpner, med https://."
target_browser.placeholder = "https://butikk.example.com/…"

