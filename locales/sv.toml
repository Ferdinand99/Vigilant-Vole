target_steam.help = "Använder port 27015 om du inte anger en."
target_game.label = "Spelserver"
target_game.help = "Börja med spelet: minecraft:// (port 25565; utan port prövas SRV-posten _minecraft._tcp först), bedrock:// (19132), satisfactory:// (7777), fivem:// (30120, även RedM) eller mumble:// (64738)."
target_tls.label = "Server"
target_tls.help = "Använder port 443 om du inte anger en. Fungerar för alla tjänster som talar TLS från första byten (HTTPS, IMAPS, LDAPS, …)."
target_smtp.label = "Mailserver"
target_smtp.help = "Använder port 25 om du inte anger en. Port 465 behandlas som implicit TLS. Andra portar uppgraderas med STARTTLS när servern erbjuder det."
target_redis.label = "Redis-server"
target_redis.help = "Använder port 6379. Lägg till rediss:// för TLS och /2 för att välja en databas."
target_postgres.label = "PostgreSQL-server"
target_postgres.help = "Använder port 5432. Sökvägen är databasnamnet. TLS används när servern erbjuder det. Lägg till ?sslmode=verify-full för att även kontrollera certifikatet (eller disable, require, verify-ca)."
target_mysql.label = "MySQL- eller MariaDB-server"
target_mysql.help = "Använder port 3306. Utan användarnamn kontrolleras bara serverns hälsning. TLS används när servern erbjuder det. Lägg till ?sslmode=verify-full för att även kontrollera certifikatet."
target_mqtt.label = "MQTT-broker"
target_mqtt.help = "Använder port 1883 (8883 för mqtts://). Lägg till ett ämne som sökväg för att prenumerera på det. Jokertecken (+ och #) fungerar som de står."
target_kafka.label = "Kafka-broker"
target_kafka.help = "Använder port 9092 (9093 för kafkas://). Lägg till ett ämne som sökväg för att kontrollera att det finns."
target_rabbitmq.label = "RabbitMQ-broker"
target_rabbitmq.help = "Använder port 5672 (5671 för amqps://). Sökvägen är den virtuella värden. Standard är /."
target_grpc.label = "gRPC-server"
target_grpc.help = "Använder port 50051 (443 för grpcs://). Sökvägen är tjänstens namn för den vanliga hälsokontrollen. Lämna tomt för hela servern."
target_grpc_keyword.label = "gRPC-metod"
target_grpc_keyword.help = "Använder port 50051 (443 för grpcs://, som även kontrollerar certifikatet). Sökvägen är tjänsten och den unära metod som anropas; ett kort tjänstnamn fungerar när det är unikt."
target_radius.label = "RADIUS-server"
target_radius.help = "Använder port 1812."
target_snmp.label = "SNMP-enhet"
target_snmp.help = "Använder port 161. Sökvägen är OID:t som ska läsas. Standard är sysUpTime (1.3.6.1.2.1.1.3.0)."
target_sqlserver.label = "SQL Server"
target_sqlserver.help = "Använder port 1433. Sökvägen är databasen. Utan användarnamn kontrolleras bara pre-login. Krypterat när servern kan; lägg till ?encrypt=true&trustServerCertificate=false för att även kontrollera certifikatet (eller encrypt=false, disable, strict)."
target_mongodb.label = "MongoDB-server"
target_mongodb.help = "Använder port 27017. Ange flera värdar med kommatecken, eller använd mongodb+srv://. Lägg till ?tls=true för TLS (certifikatet kontrolleras; tlsAllowInvalidCertificates=true hoppar över det) och ?replicaSet= för att kräva en primär. Sökvägen eller authSource är autentiseringsdatabasen (standard admin)."
target_browser.label = "Sid-URL"
target_browser.help = "Sidan som fjärrwebbläsaren öppnar, inklusive https://."
target_browser.placeholder = "https://shop.example.com/…"

