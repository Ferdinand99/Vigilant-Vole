target_dns.label = "検索する名前"
target_dns.help = "PTRレコードの場合は、IPアドレスを入力します。"
target_docker.label = "コンテナー"
target_docker.help = "コンテナーの名前またはIDです。"
target_domain.label = "ドメイン"
target_domain.help = "サブドメインとURLは、登録ドメインに短縮されます。"
target_ntp.label = "サーバー"
target_ntp.help = "ポートを指定しない場合は123を使います。"
target_steam.label = "サーバー"
target_steam.help = "ポートを指定しない場合は27015を使います。"
target_game.label = "ゲームサーバー"
target_game.help = "ゲームから始めます：minecraft://（ポート25565。ポートなしの場合は先に_minecraft._tcp SRVレコードを試行）、bedrock://（19132）、satisfactory://（7777）、fivem://（30120、RedMにも対応）、mumble://（64738）。"
target_tls.label = "サーバー"
target_tls.help = "ポートを指定しない場合は443を使います。最初のバイトからTLSで通信するサービス（HTTPS、IMAPS、LDAPS など）で使えます。"
target_smtp.label = "メールサーバー"
target_smtp.help = "ポートを指定しない場合は25を使います。465は暗黙的TLSとして扱い、それ以外のポートはサーバーが対応していればSTARTTLSに切り替えます。"
target_redis.label = "Redisサーバー"
target_redis.help = "ポート6379を使います。TLSには rediss://、データベースの指定には /2 を追加します。"
target_postgres.label = "PostgreSQLサーバー"
target_postgres.help = "ポート5432を使います。パスはデータベース名です。サーバーが対応していればTLSを使います。証明書も検証するには ?sslmode=verify-full を追加してください（disable、require、verify-ca も指定できます）。"
target_mysql.label = "MySQLまたはMariaDBサーバー"
target_mysql.help = "ポート3306を使います。ユーザー名がない場合は、サーバーのグリーティングのみチェックします。サーバーが対応していればTLSを使います。証明書も検証するには ?sslmode=verify-full を追加してください。"
target_mqtt.label = "MQTTブローカー"
target_mqtt.help = "ポート1883を使います（mqtts:// は8883）。パスにトピックを追加すると、そのトピックをサブスクライブします。ワイルドカード（+ と #）はそのまま使えます。"
target_kafka.label = "Kafkaブローカー"
target_kafka.help = "ポート9092を使います（kafkas:// は9093）。パスにトピックを追加すると、その存在を確認します。"
target_rabbitmq.label = "RabbitMQブローカー"
target_rabbitmq.help = "ポート5672を使います（amqps:// は5671）。パスは仮想ホストで、デフォルトは / です。"
target_grpc.label = "gRPCサーバー"
target_grpc.help = "ポート50051を使います（grpcs:// は443）。パスは標準のヘルスチェックに使うサービス名です。空欄ならサーバー全体を対象にします。"
target_grpc_keyword.label = "gRPCメソッド"
target_grpc_keyword.help = "ポート50051を使用します（grpcs://は443で、証明書も確認します）。パスは呼び出すサービスとunaryメソッドです。一意であれば短いサービス名も使えます。"
target_radius.label = "RADIUSサーバー"
target_radius.help = "ポート1812を使います。"
target_snmp.label = "SNMPデバイス"
target_snmp.help = "ポート161を使います。パスは読み取るOIDで、デフォルトは sysUpTime（1.3.6.1.2.1.1.3.0）です。"
target_sqlserver.label = "SQL Server"
target_sqlserver.help = "ポート1433を使用します。パスはデータベースです。ユーザー名がない場合はプレログインのみ確認します。サーバーが対応していれば暗号化されます。証明書も確認するには ?encrypt=true&trustServerCertificate=false を追加します（encrypt=false、disable、strictも指定可）。"
target_mongodb.label = "MongoDBサーバー"
target_mongodb.help = "ポート27017を使用します。複数のホストはカンマで区切るか、mongodb+srv:// を使用します。TLSには ?tls=true を追加し（証明書は検証され、tlsAllowInvalidCertificates=true で省略可）、プライマリを必須にするには ?replicaSet= を追加します。パスまたはauthSourceが認証データベースです（既定はadmin）。"
target_browser.label = "ページURL"
target_browser.help = "リモートブラウザーが開くページです。https:// を含めてください。"
target_browser.placeholder = "https://shop.example.com/…"

